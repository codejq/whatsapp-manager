name: Feature request / اقتراح ميزة
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like? / ما الذي تقترحه؟
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful? / لماذا هو مفيد؟
